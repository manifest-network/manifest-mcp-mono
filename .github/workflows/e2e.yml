name: E2E
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ssh-key: ${{ secrets.FRED_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Provision loopback XFS (project quotas) for retention volumes
        run: |
          set -euo pipefail
          sudo apt-get install -y xfsprogs          # explicit: don't rely on the ubuntu-latest preinstalled set for mkfs.xfs/xfs_quota
          sudo mkdir -p /mnt/fred-xfs
          truncate -s 2G /tmp/fred-xfs.img          # > mkfs.xfs 300MB floor
          sudo mkfs.xfs -f /tmp/fred-xfs.img
          sudo mount -o loop,prjquota /tmp/fred-xfs.img /mnt/fred-xfs
          sudo chmod 0777 /mnt/fred-xfs
          xfs_quota -x -c 'state -p' /mnt/fred-xfs   # fail loudly if project quota isn't active

      - name: Build Docker images
        run: docker compose -f e2e/docker-compose.yml build

      - name: Start devnet
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 180

      - name: Install and build
        run: |
          npm ci
          npm run check:fred-manifest-schema
          npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs > e2e-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e-logs.txt

      - name: Teardown
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v --remove-orphans
