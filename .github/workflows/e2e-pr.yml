name: E2E (PR)

# Runs on EVERY PR (no `on.paths` filter) so `e2e-gate` always posts a status and can be required
# by a branch ruleset. A path-filtered required check would never report on a docs-only PR.
# The expensive live job is instead gated by the `changes` job + a job-level `if`.
on:
  pull_request:

# Cancel superseded runs on the same PR (bound cost).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (checkout needs read; the live job's submodule fetch uses the ssh-key).
permissions:
  contents: read

jobs:
  changes:
    # Native change detection (replaces the old on.pull_request.paths). Cheap: a checkout + one git
    # diff. Outputs whether a deploy-relevant path changed.
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base commit to diff against
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # RUNTIME dependency closure of SDK acceptance plus MCP maintenance/restore.
        #   TS graph:  the acceptance app imports ONLY @manifest-network/manifest-sdk + manifestjs
        #     → core + fred + agent-core + sdk. The MCP suites also exercise lease + node.
        #   LIVE graph: the compose devnet builds the chain from submodules/manifest-ledger and the
        #     provider from submodules/fred — a submodule-pointer bump (submodules/**) OR a submodule
        #     URL/branch switch (.gitmodules) alters the devnet build. Both are in the closure.
        run: |
          set -euo pipefail
          # Capture in a STANDALONE command so a git diff error FAILS this job (→ e2e-gate reds),
          # rather than silently routing to the else branch (deploy=false) and false-greening the gate.
          # Triple-dot (merge-base...head) so we see ONLY this PR's own changes — matching GitHub's
          # native pull_request.paths semantics — not commits that landed on base after divergence
          # (which a two-arg `diff base head` would include, over-triggering the live job). fetch-depth:0
          # above makes the merge-base available.
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$files" | grep -Eq \
            '^(packages/(core|fred|agent-core|sdk|lease|node)/|examples/sdk-acceptance/|e2e/|scripts/check-e2e-env\.mjs$|submodules/|\.gitmodules$|package\.json$|package-lock\.json$|\.github/workflows/e2e-pr\.yml$)'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  acceptance-single:
    name: SDK, maintenance, and restore (${{ matrix.fred }})
    needs: changes
    # Run the live suites ONLY when a deploy-relevant path changed, on a same-repo non-Dependabot PR.
    # FORK PRs get empty secrets → skip. Dependabot PRs are same-repo but ALSO get no secrets, so the
    # SSH submodule checkout would hard-fail — exclude them too. `github.actor` (not `triggering_actor`)
    # is deliberate: it stays 'dependabot[bot]' on a human re-run, so the skip holds.
    if: >-
      needs.changes.outputs.deploy == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # Includes Docker installation, fresh authority startup, and the sequential
    # SDK, maintenance, and retained-volume compatibility suites.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fred: ['v0.13', 'pr240']
    env:
      FRED_COMPATIBILITY: ${{ matrix.fred }}
      MANIFEST_FRED_COMPATIBILITY: ${{ matrix.fred }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ssh-key: ${{ secrets.FRED_DEPLOY_KEY }}

      # Keep the schema/provenance submodule at PR #240. Legacy images use an
      # independent ignored checkout of the immutable v0.13.0 commit.
      - name: Checkout Fred v0.13.0 separately
        if: matrix.fred == 'v0.13'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: manifest-network/fred
          ref: 8f0cbd9431b482732d60d81fb59f94a37cd06486
          path: e2e/.fred-v013
          ssh-key: ${{ secrets.FRED_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install supported Docker Engine
        run: bash e2e/scripts/setup_ci_docker.sh

      - name: Provision loopback XFS (project quotas) for retention volumes
        run: |
          set -euo pipefail
          sudo apt-get install -y xfsprogs          # explicit: don't rely on the runner preinstalled set for mkfs.xfs/xfs_quota
          sudo mkdir -p /mnt/fred-xfs
          truncate -s 2G /tmp/fred-xfs.img          # > mkfs.xfs 300MB floor
          sudo mkfs.xfs -f /tmp/fred-xfs.img
          sudo mount -o loop,prjquota /tmp/fred-xfs.img /mnt/fred-xfs
          sudo chmod 0777 /mnt/fred-xfs
          xfs_quota -x -c 'state -p' /mnt/fred-xfs   # diagnostic state; preflight below asserts it

      - name: Verify local Docker and XFS quota environment
        run: node scripts/check-e2e-env.mjs

      - name: Build Docker images
        run: bash e2e/scripts/devnet.sh build

      - name: Install and build
        run: |
          npm ci
          npm run check:fred-manifest-schema
          npm run build

      - name: Start devnet
        env:
          FRED_DEVNET_WAIT_TIMEOUT: 600
        run: bash e2e/scripts/devnet.sh up

      # Single SDK variant (stack + full matrix stay nightly, e2e.yml). The pretest:e2e hook builds
      # @manifest-network/sdk-acceptance; the trailing ':' pins the single-service it, not a substring.
      - name: Run the single-variant SDK acceptance flow
        run: npm run test:e2e -- e2e/sdk-acceptance.e2e.test.ts -t "single-service:"

      # Both files fund their own credits and identify their own leases. Vitest
      # disables file parallelism because they share the SDK flow's tenant wallet.
      # Reuse the initialized devnet to cover update/restart command replay and
      # the stateful close -> retained-volume restore path on every relevant PR.
      - name: Run maintenance replay and retained-volume restore
        timeout-minutes: 10
        run: npx vitest run --config e2e/vitest.compat.config.ts

      # Preserve each version's state; PR #240 also verifies both authorities.
      - name: Verify devnet restart preserves authority
        timeout-minutes: 10
        env:
          FRED_DEVNET_WAIT_TIMEOUT: 600
        run: |
          bash e2e/scripts/devnet.sh down
          bash e2e/scripts/devnet.sh up

      - name: Collect logs on failure
        if: failure()
        run: bash e2e/scripts/devnet.sh logs > e2e-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-pr-logs-${{ matrix.fred }}
          path: e2e-logs.txt

      - name: Teardown
        if: always()
        run: bash e2e/scripts/devnet.sh down

  e2e-gate:
    # Stable check for branch rulesets. Runs on EVERY PR (if: always(), even when acceptance-single
    # was skipped), so a required check always has a result. RED when the
    # change-detection job did not succeed (a broken filter would falsely skip the live job) OR the
    # live job failed/cancelled or was skipped on a deploy-relevant change. Fork/Dependabot
    # skips mean coverage is missing; they must not look like a passing acceptance run.
    needs: [changes, acceptance-single]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Gate on change-detection + the acceptance result
        env:
          CHANGES: ${{ needs.changes.result }}
          DEPLOY: ${{ needs.changes.outputs.deploy }}
          ACCEPTANCE: ${{ needs.acceptance-single.result }}
        run: |
          set -euo pipefail
          echo "changes: $CHANGES | acceptance-single: $ACCEPTANCE"
          if [ "$CHANGES" != 'success' ]; then
            echo "::error::change-detection job did not succeed ($CHANGES) — cannot trust the gate"
            exit 1
          fi
          if [ "$DEPLOY" != 'true' ] && [ "$DEPLOY" != 'false' ]; then
            echo '::error::change-detection returned no valid deploy decision'
            exit 1
          fi
          if [ "$ACCEPTANCE" = 'failure' ] || [ "$ACCEPTANCE" = 'cancelled' ]; then
            echo '::error::live SDK, maintenance, or restore e2e failed'
            exit 1
          fi
          if [ "$DEPLOY" = 'true' ] && [ "$ACCEPTANCE" != 'success' ]; then
            echo '::error::deploy-relevant changes require successful live acceptance; a skipped run provides no coverage. A maintainer must carry these changes on a same-repository, non-Dependabot PR so acceptance-single can run.'
            exit 1
          fi
          if [ "$ACCEPTANCE" != 'success' ] && [ "$ACCEPTANCE" != 'skipped' ]; then
            echo '::error::unexpected acceptance result'
            exit 1
          fi
          echo 'OK (acceptance passed or no deploy-relevant changes)'
