# E2E Docker Compose for MCP Server Integration Testing
#
# Services:
#   - chain: Blockchain node (manifest-ledger, billing-v2 branch)
#   - init: Register provider and create SKUs, generate configs
#   - Native docker-backend: managed by scripts/devnet.sh on the Docker host
#   - placement-init: Prove and initialize fresh provider placement authority
#   - providerd: Provider daemon
#
# Usage:
#   bash e2e/scripts/devnet.sh up
#   bash e2e/scripts/devnet.sh down
# Preserve named volumes and /mnt/fred-xfs together across restarts. A complete
# disposable reset must recreate BOTH; see docs/e2e-setup.md before using down -v.

services:
  # ===========================================================================
  # Blockchain Node
  # ===========================================================================
  chain:
    build:
      context: ../submodules/manifest-ledger
      dockerfile: ../../e2e/docker/manifest-ledger/Dockerfile
    volumes:
      - chain-data:/persistent
      - shared-data:/shared
      - ./scripts/init_chain.sh:/usr/local/bin/init_chain.sh:ro
    ports:
      - "9090:9090"   # gRPC
      - "26657:26657" # RPC
      - "1317:1317"   # REST
    env_file: .env
    entrypoint: ["/bin/bash"]
    command: ["/usr/local/bin/init_chain.sh"]
    healthcheck:
      test: curl -sf http://localhost:26657/status | grep -q '"catching_up":false'
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - mcp-e2e

  # ===========================================================================
  # Chain Initialization (Provider + SKU Registration)
  # ===========================================================================
  init:
    build:
      context: ../submodules/manifest-ledger
      dockerfile: ../../e2e/docker/manifest-ledger/Dockerfile
    volumes:
      - chain-data:/persistent
      - shared-data:/shared
      - ./scripts/init_billing.sh:/usr/local/bin/init_billing.sh:ro
    env_file: .env
    entrypoint: ["/bin/bash"]
    command: ["/usr/local/bin/init_billing.sh"]
    depends_on:
      chain:
        condition: service_healthy
    restart: "no"
    networks:
      - mcp-e2e

  # ===========================================================================
  # CosmJS Faucet (patched for tokenfactory denoms)
  #
  # Drips MFX + factory/POA_ADMIN/upwr (PWR) to any requested address.
  # Used by request-faucet.e2e.test.ts to exercise the chain server's
  # conditional `request_faucet` tool registration.
  # ===========================================================================
  faucet:
    build:
      context: ./docker/faucet
    volumes:
      - ./scripts/start_faucet.sh:/app/start_faucet.sh:ro
    ports:
      - "8000:8000"
    environment:
      - FAUCET_CONCURRENCY=3
      - FAUCET_PORT=8000
      - FAUCET_MNEMONIC=${MNEMO3}
      - FAUCET_ADDRESS_PREFIX=manifest
      - FAUCET_TOKENS=umfx,factory/${POA_ADMIN_ADDRESS}/upwr
      - FAUCET_CREDIT_AMOUNT_UMFX=${FAUCET_CREDIT_AMOUNT_MFX}
      - FAUCET_PWR_DENOM=factory/${POA_ADMIN_ADDRESS}/upwr
      - FAUCET_CREDIT_AMOUNT_PWR=${FAUCET_CREDIT_AMOUNT_PWR}
      - FAUCET_COOLDOWN_TIME=${FAUCET_COOLDOWN_TIME}
      - FAUCET_GAS_LIMIT=200000
      - FAUCET_GAS_PRICE=0umfx
      - FAUCET_MEMO=Sent by Manifest e2e faucet
    command: ["/bin/sh", "/app/start_faucet.sh"]
    healthcheck:
      test: wget -q -O /dev/null http://localhost:8000/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      chain:
        condition: service_healthy
    networks:
      - mcp-e2e

  # ===========================================================================
  # Provider Placement Initialization
  # ===========================================================================
  placement-init:
    image: mcp-e2e-fred:local
    build:
      context: ../submodules/fred
      dockerfile: ../../e2e/docker/fred/Dockerfile
      target: providerd
    volumes:
      - shared-data:/shared:ro
      - providerd-data:/data
      - ./scripts/init_placement.sh:/usr/local/bin/init_placement.sh:ro
    command: ["/bin/sh", "/usr/local/bin/init_placement.sh"]
    # devnet.sh starts the native backend and verifies HTTPS before this service.
    extra_hosts:
      - "docker-backend:host-gateway"
    restart: "no"
    networks:
      - mcp-e2e

  # ===========================================================================
  # Provider Daemon
  # ===========================================================================
  providerd:
    image: mcp-e2e-fred:local
    build:
      context: ../submodules/fred
      dockerfile: ../../e2e/docker/fred/Dockerfile
      target: providerd
    volumes:
      - shared-data:/shared:ro
      - providerd-data:/data
    extra_hosts:
      - "docker-backend:host-gateway"
    ports:
      - "8080:8080"
    command: ["/usr/bin/providerd", "--config", "/shared/providerd.yaml"]
    healthcheck:
      test: curl --cacert /shared/tls/cert.pem -f https://localhost:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      placement-init:
        condition: service_completed_successfully
    networks:
      - mcp-e2e

# =============================================================================
# Volumes
# =============================================================================
volumes:
  chain-data:
    name: mcp-e2e-chain-data
  shared-data:
    name: mcp-e2e-shared-data
  providerd-data:
    name: mcp-e2e-providerd-data

# =============================================================================
# Networks
# =============================================================================
networks:
  mcp-e2e:
    name: mcp-e2e-network
    driver: bridge
